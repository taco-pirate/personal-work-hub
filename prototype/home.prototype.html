<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Personal Work Hub</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fbfaf8; --bg-side: #f4f3f0; --surface: #fff; --surface-2: #f6f5f2;
    --text: #1d1c1a; --text-2: #57544e; --text-3: #6b6760;
    --border: #e9e7e2; --border-strong: #dad7d0;
    --accent: #4b5bd6; --hot: #b23c30; --ok: #25754b;
    --shadow: 0 1px 2px rgba(28, 25, 20, .04);
    --side: 15.5rem; --gutter: 1.5rem;
    --font: Geist, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1a1a19; --bg-side: #151514; --surface: #1d1d1c; --surface-2: #252524;
    --text: #eceae5; --text-2: #b5b2ab; --text-3: #9a968f;
    --border: #2c2b29; --border-strong: #3a3936;
    --accent: #8e9af3; --hot: #e57d70; --ok: #5cba86;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font: 13.5px/1.45 var(--font); }
  button, select, input { font: inherit; color: inherit; }
  button, a { cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  .shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
  .shell.folded { --side: 4.25rem; }
  .side {
    background: var(--bg-side); border-right: 1px solid var(--border);
    padding: 0.9rem 0.7rem; display: flex; flex-direction: column; gap: 0.35rem;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; padding: 0.2rem 0.45rem 0.7rem; }
  .brand strong { font-weight: 560; letter-spacing: -0.02em; }
  .folded .brand strong, .folded .nav span, .folded .side-note { display: none; }
  .icon-btn, .theme-btn { border: 0; background: transparent; border-radius: 0.45rem; color: var(--text-2); }
  .nav { display: flex; flex-direction: column; gap: 0.15rem; }
  .nav a { padding: 0.45rem 0.55rem; display: flex; gap: 0.55rem; align-items: center; border-radius: 0.45rem; color: var(--text-2); }
  .nav a[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow), 0 0 0 1px var(--border); }
  .nav i { width: 1.1rem; text-align: center; font-style: normal; color: var(--text-3); }
  .side-note { margin-top: auto; padding: 0.6rem; color: var(--text-3); font-size: 12px; }
  .theme-btn { margin-top: 0.4rem; text-align: left; padding: 0.4rem 0.55rem; }
  .main { padding: var(--gutter); min-width: 0; }
  header h1, .record h1 { margin: 0; font-size: 1.35rem; font-weight: 560; letter-spacing: -0.03em; }
  header p, .quiet-meta { margin: 0.2rem 0 0; color: var(--text-3); }
  .metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.75rem; margin: 1rem 0 1.1rem; }
  .metrics div { background: var(--surface); border: 1px solid var(--border); border-radius: 0.6rem; padding: 0.7rem 0.8rem; box-shadow: var(--shadow); }
  .metrics b { display: block; font-size: 1.35rem; font-weight: 560; letter-spacing: -0.03em; }
  .metrics span { color: var(--text-3); font-size: 12px; }
  .metrics .hot b { color: var(--hot); }
  .split { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(16rem, 0.7fr); gap: 1.25rem; align-items: start; }
  .card, .gap, .slot, .line, .record, .block {
    background: var(--surface); border: 1px solid var(--border); border-radius: 0.6rem; box-shadow: var(--shadow);
  }
  a.card, a.mini, a.block { display: block; }
  a.line { display: grid; }
  a.card:hover, a.line:hover, a.mini:hover, a.block:hover { border-color: var(--border-strong); }
  .card { padding: 0.75rem 0.9rem; margin-bottom: 0.45rem; }
  .card.escalated, .line.escalated, .mini.escalated { box-shadow: inset 3px 0 0 var(--hot), var(--shadow); }
  .kind { color: var(--text-3); font-size: 12px; }
  .kind em { color: var(--hot); font-style: normal; }
  .row-top { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
  h2 { margin: 0.1rem 0 0; font-size: 1rem; font-weight: 560; }
  .meta { color: var(--text-3); text-align: right; font-size: 12px; }
  aside h3 { margin: 0 0 0.55rem; font-size: 12px; font-weight: 560; color: var(--text-2); }
  .day { margin-bottom: 0.9rem; }
  .day strong { display: block; margin-bottom: 0.25rem; }
  .gap { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.35rem 0.55rem; margin-bottom: 0.3rem; color: var(--text-2); }
  .cols, .line { display: grid; grid-template-columns: 5.5rem minmax(0, 1.6fr) 6.5rem 7rem minmax(0, 1fr) 6rem; gap: 0.6rem; align-items: center; }
  .cols { color: var(--text-3); font-size: 12px; padding: 0 0.7rem 0.35rem; }
  .line { padding: 0.55rem 0.7rem; margin-bottom: 0.3rem; }
  .toolbar { display: flex; gap: 0.35rem; margin: 0.8rem 0; }
  .toolbar a { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 999px; padding: 0.28rem 0.65rem; }
  .toolbar a[aria-current="page"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .board { display: flex; flex-direction: column; gap: 0.8rem; }
  .lane { display: grid; grid-template-columns: 7rem repeat(5, minmax(8.5rem, 1fr)); gap: 0.45rem; }
  .lane h3, .colhead { margin: 0; font-size: 12px; font-weight: 560; color: var(--text-2); }
  .slot { min-height: 4.5rem; padding: 0.35rem; background: var(--surface-2); }
  .slot.over { outline: 2px solid var(--accent); }
  .mini { padding: 0.55rem 0.6rem; margin-bottom: 0.35rem; }
  .mini h2 { font-size: 0.92rem; }
  .cal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.7rem; }
  .cal .day { background: var(--surface); border: 1px solid var(--border); border-radius: 0.7rem; padding: 0.75rem; }
  .block { padding: 0.45rem 0.55rem; margin-top: 0.35rem; }
  .block.meeting { background: var(--surface-2); }
  .block.gap, .block.focus { background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
  .block.free { background: transparent; border-style: dashed; color: var(--text-3); }
  .when { color: var(--text-3); font-size: 12px; }
  .record { max-width: 40rem; padding: 1rem 1.1rem 1.2rem; }
  .back { display: inline-block; margin-bottom: 0.8rem; color: var(--text-2); background: none; border: 0; padding: 0; }
  .section { margin-top: 1rem; padding-top: 0.8rem; border-top: 1px solid var(--border); }
  .section h3 { margin: 0 0 0.4rem; font-size: 12px; font-weight: 560; color: var(--text-2); }
  .actions { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; margin-top: 0.8rem; }
  .actions button, .links a { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 999px; padding: 0.28rem 0.65rem; }
  select, input { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 0.4rem; padding: 0.28rem 0.4rem; }
  input { min-width: 16rem; }
  .flash { margin: 0.7rem 0; padding: 0.45rem 0.65rem; border-radius: 0.45rem; background: color-mix(in srgb, var(--hot) 12%, var(--surface)); color: var(--hot); }
  .comments { color: var(--text-2); font-size: 12.5px; }
  @media (max-width: 980px) {
    .shell, .shell.folded { grid-template-columns: 1fr; }
    .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; }
    .nav { flex-direction: row; }
    .side-note { display: none; }
    .split, .cal, .metrics, .lane, .line { grid-template-columns: 1fr; }
    .cols { display: none; }
  }
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="side">
    <div class="brand"><strong>Work hub</strong><button class="icon-btn" id="fold" type="button" aria-label="Fold sidebar">Fold</button></div>
    <nav class="nav" aria-label="Pages">
      <a href="#/" data-nav="home"><i>H</i><span>Home</span></a>
      <a href="#/owed" data-nav="owed"><i>O</i><span>Owed</span></a>
      <a href="#/calendar" data-nav="calendar"><i>C</i><span>Calendar</span></a>
    </nav>
    <div class="side-note">Sample week. No folder chosen. Wednesday, Nov 4, 10:15am.</div>
    <button class="theme-btn" id="theme" type="button">Appearance</button>
  </aside>
  <main class="main" id="app"></main>
</div>
<script>
const NOW = { date: "2026-11-04", minutes: 10 * 60 + 15 };
const WEEK_START = "2026-11-02";
const DAYS = [

const WORK_END = 17 * 60;
const STATES = ["Drafted", "In Progress", "Blocked", "Ready", "Done"];
const LANES = ["Escalated", "Due", "No due"];
const CATEGORIES = ["Operating Review", "Focus Time", "1:1", "Working Session", "Projects", "Leadership", "Operational Support", "Personal", "Uncategorized"];

const state = {

  flash: "",
  meetings: [
    { id: "w-or", day: "2026-11-04", start: 8 * 60, end: 9 * 60, title: "Service health", category: "Operating Review", response: "accepted", showAs: "busy" },
    { id: "w-focus", day: "2026-11-04", start: 9 * 60, end: 10 * 60 + 30, title: "Focus hold", category: "Focus Time", response: "accepted", showAs: "busy" },
    { id: "w-11", day: "2026-11-04", start: 11 * 60, end: 12 * 60, title: "Sam 1:1", category: "1:1", response: "accepted", showAs: "busy" },
    { id: "w-lunch", day: "2026-11-04", start: 12 * 60, end: 13 * 60, title: "Lunch", category: "Personal", response: "accepted", showAs: "busy" },
    { id: "w-declined", day: "2026-11-04", start: 13 * 60, end: 13 * 60 + 30, title: "Brown bag", category: "Working Session", response: "declined", showAs: "busy" },
    { id: "w-ws", day: "2026-11-04", start: 14 * 60 + 30, end: 15 * 60 + 30, title: "Design working session", category: "Working Session", response: "tentative", showAs: "busy" },
    { id: "w-lead", day: "2026-11-04", start: 16 * 60, end: 17 * 60, title: "Leadership staff", category: "Leadership", response: "accepted", showAs: "busy" },
    { id: "t-or", day: "2026-11-05", start: 8 * 60, end: 9 * 60, title: "Operating review", category: "Operating Review", response: "accepted", showAs: "busy" },
    { id: "t-proj", day: "2026-11-05", start: 10 * 60 + 30, end: 12 * 60, title: "Portal status", category: "Projects", response: "accepted", showAs: "busy" },
    { id: "t-lunch", day: "2026-11-05", start: 12 * 60, end: 13 * 60, title: "Lunch", category: "Personal", response: "accepted", showAs: "busy" },
    { id: "t-focus", day: "2026-11-05", start: 13 * 60, end: 14 * 60, title: "Focus hold", category: "Focus Time", response: "accepted", showAs: "busy" },
    { id: "t-11", day: "2026-11-05", start: 14 * 60, end: 14 * 60 + 15, title: "Skip-level", category: "1:1", response: "accepted", showAs: "busy" },
    { id: "t-free", day: "2026-11-05", start: 14 * 60 + 15, end: 15 * 60, title: "Hold, unlabeled", category: "Uncategorized", response: "accepted", showAs: "free" },
    { id: "t-or2", day: "2026-11-05", start: 15 * 60, end: 16 * 60 + 30, title: "Ops review", category: "Operating Review", response: "accepted", showAs: "busy" },
    { id: "f-ws", day: "2026-11-06", start: 9 * 60, end: 12 * 60, title: "Spec working session", category: "Working Session", response: "accepted", showAs: "busy" },
    { id: "f-lunch", day: "2026-11-06", start: 12 * 60, end: 13 * 60, title: "Lunch", category: "Personal", response: "accepted", showAs: "busy" },
    { id: "f-ops", day: "2026-11-06", start: 15 * 60, end: 17 * 60, title: "On-call bridge", category: "Operational Support", response: "tentative", showAs: "busy" }
  ],
  items: [
    { id: "deck", kind: "Reply", title: "Reply with notes on the Q4 deck", status: "Drafted", due: "2026-11-05T17:00", escalated: true, created: 1, finished: "", returns: "", parked: "", source: "q4", from: "Priya Shah", outlook: "https://outlook.office365.com/owa/?ItemID=deck", action: "", body: "Priya, I can send notes on the deck by [Confirm you can send notes by Thursday]. I'll focus on the recommendation slides.", comments: [{ who: "Alex Chen", when: "Wed 8:12am", text: "Need the notes today. This is blocking the Thursday review.", outlook: "https://outlook.office365.com/owa/?ItemID=deck-chase" }] },
    { id: "confirm", kind: "Reply", title: "Confirm Thursday's 1:1 still works", status: "Ready", due: "2026-11-04T17:00", escalated: false, created: 2, finished: "", returns: "", parked: "", source: "sam", from: "Sam Ortiz", outlook: "https://outlook.office365.com/owa/?ItemID=confirm", action: "", body: "Sam, Thursday at 2:00 still works. I'll bring the skip-level notes.", comments: [] },
    { id: "notes", kind: "Reply", title: "Share the Q3 readout", status: "In Progress", due: "2026-11-06T17:00", escalated: false, created: 3, finished: "", returns: "", parked: "", source: "q3", from: "Jordan Lee", outlook: "https://outlook.office365.com/owa/?ItemID=notes", action: "", body: "Jordan, the readout is in progress. I'll send the one-page version.", comments: [] },

    { id: "training", kind: "Task", title: "Complete security training", status: "In Progress", due: "2026-11-06T17:00", escalated: false, created: 4, finished: "", returns: "", parked: "", source: "train", from: "Learning portal", outlook: "https://outlook.office365.com/owa/?ItemID=training", action: "https://learning.example.com/security", body: "Finish the course. No reply is owed.", comments: [{ who: "Learning portal", when: "Wed 7:02am", text: "Reminder: training is still due Friday.", outlook: "https://outlook.office365.com/owa/?ItemID=training-reminder" }] },
    { id: "access", kind: "Task", title: "Get a badge reader for the lab", status: "Blocked", due: "2026-11-05T17:00", escalated: false, created: 5, finished: "", returns: "", parked: "", source: "badge-reader", from: "Facilities", outlook: "https://outlook.office365.com/owa/?ItemID=access", action: "", body: "Waiting on facilities to say which reader to order.", comments: [] },
    { id: "badge", kind: "Task", title: "Send facilities the badge form", status: "Drafted", due: "", escalated: false, created: 6, finished: "", returns: "", parked: "", source: "badge-form", from: "Facilities", outlook: "https://outlook.office365.com/owa/?ItemID=badge", action: "", body: "The email names no date and no single form link.", comments: [] },
    { id: "roster", kind: "Reply", title: "Sent the on-call roster", status: "Done", due: "2026-11-03T17:00", escalated: false, created: 7, finished: "2026-11-03", returns: "", parked: "", source: "roster", from: "Ops", outlook: "https://outlook.office365.com/owa/?ItemID=roster", action: "", body: "Sent Tuesday. It stays on the board through this workweek.", comments: [] },
    { id: "vendor", kind: "Task", title: "Renew the vendor certificate", status: "Deferred", due: "2026-11-02T17:00", escalated: false, created: 9, finished: "", returns: "2026-11-09", parked: "In Progress", source: "vendor", from: "Security", outlook: "https://outlook.office365.com/owa/?ItemID=vendor", action: "", body: "Set aside until next Monday.", comments: [] },
    { id: "poster", kind: "Task", title: "Print the lobby poster", status: "Dropped", due: "", escalated: false, created: 10, finished: "", returns: "", parked: "", source: "poster", from: "Facilities", outlook: "https://outlook.office365.com/owa/?ItemID=poster", action: "", body: "You will not do this.", comments: [] },
    { id: "old", kind: "Reply", title: "Last week's status note", status: "Archived", due: "2026-10-28T17:00", escalated: false, created: 11, finished: "2026-10-28", returns: "", parked: "", source: "old", from: "Ops", outlook: "https://outlook.office365.com/owa/?ItemID=old", action: "", body: "Archived when this workweek started.", comments: [] }
  ]
};

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function pad(n) { return String(n).padStart(2, "0"); }
function clock(minutes) {
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  const suffix = h >= 12 ? "pm" : "am";
  return (h % 12 || 12) + ":" + pad(m) + suffix;
}
function hours(minutes) {
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  if (h && m) return h + "h " + m + "m";
  if (h) return h + "h";
  return m + "m";
}
function dueLabel(due) {
  if (!due) return "No due date";
  const map = { "2026-10-28": "Oct 28", "2026-11-02": "Mon 5:00pm", "2026-11-03": "Tue 5:00pm", "2026-11-04": "Today 5:00pm", "2026-11-05": "Thu 5:00pm", "2026-11-06": "Fri 5:00pm" };
  return map[due.slice(0, 10)] || due.slice(0, 10);
}
function alive(meeting) { return meeting.response !== "declined" && meeting.response !== "canceled"; }
function consumes(meeting) {
  return alive(meeting) && meeting.category !== "Personal" && meeting.category !== "Focus Time" && meeting.showAs !== "free" && meeting.showAs !== "workingElsewhere";
}
function isFocus(meeting) { return alive(meeting) && meeting.category === "Focus Time"; }
function dayStart(date) { return date === NOW.date ? Math.max(NOW.minutes, WORK_START) : WORK_START; }
function clip(meeting, date) {
  const start = Math.max(meeting.start, dayStart(date));
  const end = Math.min(meeting.end, WORK_END);
  return end > start ? { start, end } : null;
}
function usableParts(date) {
  const start = dayStart(date);
  const blocks = state.meetings
    .filter((meeting) => meeting.day === date && (consumes(meeting) || isFocus(meeting)))
    .map((meeting) => ({ ...clip(meeting, date), focus: isFocus(meeting), meeting }))
    .filter((block) => block.start != null)
    .sort((a, b) => a.start - b.start);
  const parts = [];
  let cursor = start;
  for (const block of blocks) {
    if (block.start - cursor >= 15) parts.push({ kind: "gap", start: cursor, end: block.start });
    parts.push({ kind: block.focus ? "focus" : "meeting", start: block.start, end: block.end, meeting: block.meeting });
    cursor = Math.max(cursor, block.end);
  }
  if (WORK_END - cursor >= 15) parts.push({ kind: "gap", start: cursor, end: WORK_END });
  const free = state.meetings.filter((meeting) => meeting.day === date && alive(meeting) && !consumes(meeting) && !isFocus(meeting) && meeting.category !== "Personal" && meeting.end > start);
  return { parts, free };
}
function sum(parts, kind) {
  return parts.filter((part) => part.kind === kind).reduce((total, part) => total + (part.end - part.start), 0);
}
function dayIndex(date) { return DAYS.findIndex((day) => day.date === date); }
function aheadIntervals(kind) {
  const intervals = [];
  for (const day of DAYS) {
    for (const part of usableParts(day.date).parts) {
      if (part.kind === kind) intervals.push([part.start + dayIndex(day.date) * 1440, part.end + dayIndex(day.date) * 1440]);
    }
  }
  intervals.sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const interval of intervals) {
    const last = merged[merged.length - 1];
    if (!last || interval[0] > last[1]) merged.push(interval.slice());
    else last[1] = Math.max(last[1], interval[1]);
  }
  return merged.reduce((total, interval) => total + (interval[1] - interval[0]), 0);
}
function owedItems() {
  return state.items.filter((item) => STATES.includes(item.status) && item.status !== "Done");
}
function sortedOwed() {
  return owedItems().slice().sort((a, b) => {
    if (a.escalated !== b.escalated) return a.escalated ? -1 : 1;
    if (Boolean(a.due) !== Boolean(b.due)) return a.due ? -1 : 1;
    if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
    return a.created - b.created;
  });
}
function laneOf(item) {
  if (item.escalated) return "Escalated";
  if (item.due) return "Due";
  return "No due";
}
function doneThisWeek() {
  return state.items.filter((item) => item.status === "Done" && item.finished >= WEEK_START && item.finished <= "2026-11-06");
}
function hrefFor(item) {
  return "#/" + (item.kind === "Reply" ? "replies" : "tasks") + "/" + encodeURIComponent(item.id);
}
function findItem(id) { return state.items.find((item) => item.id === id); }
function hasPlaceholder(item) { return item.body.includes("["); }
function locked(item) { return LOCKED.includes(item.status); }
function route() {
  const parts = (location.hash || "#/").slice(1).split("/").filter(Boolean);
  if (parts[0] === "owed" && parts[1] === "board") return { name: "board" };
  if (parts[0] === "owed") return { name: "owed" };
  if (parts[0] === "calendar") return { name: "calendar" };
  if (parts[0] === "replies" && parts[1]) return { name: "record", kind: "Reply", id: decodeURIComponent(parts[1]) };
  if (parts[0] === "tasks" && parts[1]) return { name: "record", kind: "Task", id: decodeURIComponent(parts[1]) };
  if (parts[0] === "meetings" && parts[1]) return { name: "meeting", id: decodeURIComponent(parts[1]) };
  return { name: "home" };
}
function parentHash(hash) {
  if (hash.startsWith("#/meetings/")) return "#/calendar";
  if (hash.startsWith("#/replies/") || hash.startsWith("#/tasks/")) return "#/owed";
  return "#/";
}

function metrics(list) {
  const usable = DAYS.reduce((total, day) => {
    const { parts } = usableParts(day.date);
    return total + sum(parts, "gap") + sum(parts, "focus");
  }, 0);
  const cells = [
    ["Owed", String(list.length), false],
    ["Escalated", String(list.filter((item) => item.escalated).length), true],
    ["Replies", String(list.filter((item) => item.kind === "Reply").length), false],
    ["Tasks", String(list.filter((item) => item.kind === "Task").length), false],
    ["Usable", hours(usable), false]
  ];
  return `<div class="metrics">${cells.map(([label, value, hot]) => `<div class="${hot && value !== "0" ? "hot" : ""}"><b>${esc(value)}</b><span>${esc(label)}</span></div>`).join("")}</div>`;
}
function quietCard(item) {
  return `<a class="card${item.escalated ? " escalated" : ""}" href="${hrefFor(item)}">
    <div class="kind">${esc(item.kind)}${item.escalated ? " · <em>Escalated</em>" : ""}</div>
    <div class="row-top"><h2>${esc(item.title)}</h2><div class="meta">${esc(dueLabel(item.due))}</div></div>
  </a>`;
}
function gapAside() {
  return `<aside><h3>Usable gaps</h3>${DAYS.map((day) => {
    const gaps = usableParts(day.date).parts.filter((part) => part.kind === "gap" || part.kind === "focus");
    const rows = gaps.length ? gaps.map((part) => `<div class="gap"><span>${part.kind === "focus" ? "Focus" : "Open"} ${clock(part.start)}–${clock(part.end)}</span><span>${hours(part.end - part.start)}</span></div>`).join("") : `<div class="gap"><span>No usable gap left</span></div>`;
    return `<div class="day"><strong>${esc(day.label)}</strong>${rows}</div>`;
  }).join("")}</aside>`;
}
function line(item) {
  return `<a class="line${item.escalated ? " escalated" : ""}" href="${hrefFor(item)}">
    <span>${esc(item.kind)}</span><span>${esc(item.title)}</span><span>${esc(item.status)}</span><span>${esc(dueLabel(item.due))}</span><span>${esc(item.from)}</span><span>${item.escalated ? "Escalated" : ""}</span>
  </a>`;
}
function mini(item) {
  return `<a class="mini card${item.escalated ? " escalated" : ""}" draggable="true" data-drag="${item.id}" href="${hrefFor(item)}">
    <div class="kind">${esc(item.kind)}${item.escalated ? " · <em>Escalated</em>" : ""}</div>
    <h2>${esc(item.title)}</h2>
    <div class="meta">${esc(dueLabel(item.due))}</div>
  </a>`;
}
function renderHome(list) {
  return `<header><h1>Wednesday, Nov 4</h1><p>Sample week</p></header>${metrics(list)}
    <div class="split"><section>${list.map(quietCard).join("") || "<p>Nothing owed.</p>"}</section>${gapAside()}</div>`;
}
function renderOwed(list, board) {
  const here = board ? "board" : "list";
  const switcher = `<div class="toolbar"><a href="#/owed" ${here === "list" ? 'aria-current="page"' : ""}>List</a><a href="#/owed/board" ${here === "board" ? 'aria-current="page"' : ""}>Board</a></div>`;
  let body;
  if (!board) {
    body = `<div class="cols"><span>Kind</span><span>Title</span><span>State</span><span>Due</span><span>From</span><span>Escalated</span></div>${list.map(line).join("") || "<p>Nothing owed.</p>"}`;
  } else {
    const items = list.concat(doneThisWeek());
    const heads = `<div class="lane"><h3></h3>${STATES.map((name) => `<div class="colhead">${esc(name)}</div>`).join("")}</div>`;
    const lanes = LANES.map((lane) => `<div class="lane"><h3>${esc(lane)}</h3>${STATES.map((name) => {
      const cards = items.filter((item) => laneOf(item) === lane && item.status === name).sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999") || a.created - b.created);
      return `<div class="slot" data-drop="${esc(name)}">${cards.map(mini).join("")}</div>`;
    }).join("")}</div>`).join("");
    body = `<div class="board">${heads}${lanes}</div>`;
  }
  return `<header><h1>Owed</h1><p>${board ? "Open a card to work the record." : "Open a row to work the record."}</p>${state.flash ? `<div class="flash">${esc(state.flash)}</div>` : ""}</header>${switcher}${body}`;
}
function related(item) {
  const others = state.items.filter((other) => other.source === item.source && other.id !== item.id);
  if (!others.length) return "";
  return `<div class="section"><h3>Same source</h3>${others.map((other) => `<div><a href="${hrefFor(other)}">${esc(other.kind)}: ${esc(other.title)}</a></div>`).join("")}</div>`;
}
function renderRecord(item) {
  if (!item) return `<div class="record"><button class="back" type="button" data-back>Back</button><h1>Record not in this sample</h1></div>`;
  const canMove = !locked(item);
  const stateControl = canMove ? `<select data-state="${item.id}" aria-label="State">${STATES.map((name) => `<option${name === item.status ? " selected" : ""}>${name}</option>`).join("")}</select>` : `<span>${esc(item.status)}</span>`;
  const buttons = canMove ? `${item.escalated ? `<button type="button" data-act="dismiss" data-id="${item.id}">Dismiss flag</button>` : ""}<button type="button" data-act="defer" data-id="${item.id}">Defer</button><button type="button" data-act="drop" data-id="${item.id}">Drop</button>` : "";
  const note = item.status === "Deferred" ? `<p>Returns on ${esc(item.returns)} as ${esc(item.parked)}.</p>` : item.status === "Dropped" ? "<p>Dropped. This is not Done.</p>" : item.status === "Archived" ? "<p>Archived. It cannot be moved back.</p>" : "";
  const fill = hasPlaceholder(item) && canMove ? `<p><input data-fill="${item.id}" aria-label="Replace the placeholder" placeholder="Replace the bracketed fact" /></p>` : "";
  const comments = item.comments.length ? item.comments.map((comment) => `<div class="comments"><strong>${esc(comment.who)}</strong> · ${esc(comment.when)}. ${esc(comment.text)} <a href="${esc(comment.outlook)}">Email</a></div>`).join("") : "<p>No comments.</p>";
  return `<article class="record">
    <button class="back" type="button" data-back>Back</button>
    ${state.flash ? `<div class="flash">${esc(state.flash)}</div>` : ""}
    <div class="kind">${esc(item.kind)}${item.escalated ? " · <em>Escalated</em>" : ""}</div>
    <h1>${esc(item.title)}</h1>
    <div class="actions">${stateControl}${buttons}</div>
    ${note}
    <div class="section"><h3>Body</h3><p>${esc(item.body)}</p>${fill}</div>
    <div class="section"><h3>Source</h3><p>${esc(item.from)} · ${esc(dueLabel(item.due))}</p><div class="links"><a href="${esc(item.outlook)}" target="_blank" rel="noreferrer">Outlook</a>${item.action ? ` <a href="${esc(item.action)}" target="_blank" rel="noreferrer">Do the deed</a>` : ""}</div></div>
    <div class="section"><h3>Activity</h3>${comments}</div>
    ${related(item)}
  </article>`;
}
function renderMeeting(meeting) {
  if (!meeting) return `<div class="record"><button class="back" type="button" data-back>Back</button><h1>Meeting not in this sample</h1></div>`;
  const when = DAYS.find((day) => day.date === meeting.day);
  return `<article class="record">
    <button class="back" type="button" data-back>Back</button>
    <div class="kind">${esc(when ? when.label : meeting.day)} · ${clock(meeting.start)}–${clock(meeting.end)}</div>
    <h1>${esc(meeting.title)}</h1>
    <div class="section"><h3>Category</h3><select data-category="${meeting.id}" aria-label="Category">${CATEGORIES.map((name) => `<option${name === meeting.category ? " selected" : ""}>${esc(name)}</option>`).join("")}</select></div>
    <div class="section"><h3>Source</h3><a href="https://outlook.office365.com/owa/?ItemID=${esc(meeting.id)}" target="_blank" rel="noreferrer">Outlook</a></div>
  </article>`;
}
function renderCalendar() {
  const meetingMinutes = aheadIntervals("meeting");
  const focusMinutes = aheadIntervals("focus");
  const usable = DAYS.reduce((total, day) => total + sum(usableParts(day.date).parts, "gap") + sum(usableParts(day.date).parts, "focus"), 0);
  const stillAhead = (meeting) => DAYS.some((day) => day.date === meeting.day) && (meeting.day > NOW.date || meeting.end > NOW.minutes);
  const meetingCount = state.meetings.filter((meeting) => consumes(meeting) && stillAhead(meeting)).length;
  const unlabeled = state.meetings.filter((meeting) => meeting.category === "Uncategorized" && alive(meeting) && stillAhead(meeting)).length;
  const cells = [["Meetings", String(meetingCount), false], ["In meetings", hours(meetingMinutes), false], ["Usable", hours(usable), false], ["Focus Time", hours(focusMinutes), false], ["Uncategorized", String(unlabeled), unlabeled > 0]];
  const days = DAYS.map((day) => {
    const { parts, free } = usableParts(day.date);
    const rows = parts.map((part) => {
      if (part.kind === "gap") return `<div class="block gap"><div class="when">${clock(part.start)}–${clock(part.end)}</div>Open</div>`;
      const klass = part.kind === "focus" ? "focus" : "meeting";
      return `<a class="block ${klass}" href="#/meetings/${part.meeting.id}"><div class="when">${clock(part.start)}–${clock(part.end)} · ${esc(part.meeting.category)}</div>${esc(part.meeting.title)}</a>`;
    }).join("");
    const frees = free.map((meeting) => `<a class="block free" href="#/meetings/${meeting.id}"><div class="when">${clock(meeting.start)}–${clock(meeting.end)} · does not consume · ${esc(meeting.category)}</div>${esc(meeting.title)}</a>`).join("");
    return `<section class="day"><strong>${esc(day.label)}</strong>${rows}${frees}</section>`;
  }).join("");
  return `<header><h1>This week</h1><p>Wednesday through Friday. Personal stays off the workday.</p></header>
    <div class="metrics">${cells.map(([label, value, hot]) => `<div class="${hot ? "hot" : ""}"><b>${esc(value)}</b><span>${esc(label)}</span></div>`).join("")}</div>
    <div class="cal">${days}</div>`;
}
function render() {
  document.documentElement.dataset.theme = localStorage.getItem("hub-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.getElementById("shell").classList.toggle("folded", state.folded);
  document.getElementById("fold").textContent = state.folded ? "Show" : "Fold";
  const current = route();
  document.querySelectorAll("[data-nav]").forEach((link) => {
    const on = (current.name === "home" && link.dataset.nav === "home") || ((current.name === "owed" || current.name === "board") && link.dataset.nav === "owed") || (current.name === "calendar" && link.dataset.nav === "calendar") || (current.name === "meeting" && link.dataset.nav === "calendar");
    link.setAttribute("aria-current", on ? "page" : "false");
  });
  const list = sortedOwed();
  let page = renderHome(list);
  if (current.name === "owed") page = renderOwed(list, false);
  if (current.name === "board") page = renderOwed(list, true);
  if (current.name === "calendar") page = renderCalendar();
  if (current.name === "record") page = renderRecord(state.items.find((item) => item.id === current.id && item.kind === current.kind));
  if (current.name === "meeting") page = renderMeeting(state.meetings.find((meeting) => meeting.id === current.id));
  document.getElementById("app").innerHTML = page;
}
function setStatus(id, next) {
  const item = findItem(id);
  if (!item || locked(item)) return;
  if (item.kind === "Reply" && hasPlaceholder(item) && (next === "Ready" || next === "Done")) {
    state.flash = "Replace the bracketed fact before this reply can become " + next + ".";
    render();
    return;
  }
  item.status = next;
  item.finished = next === "Done" ? NOW.date : "";
  state.flash = "";
  render();
}

let dragged = false;
document.body.addEventListener("click", (event) => {
  if (event.target.id === "fold") { state.folded = !state.folded; render(); return; }
  if (event.target.id === "theme") {
    localStorage.setItem("hub-theme", document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    render();
    return;
  }
  if (event.target.closest("[data-back]")) { history.back(); return; }
  const dragCard = event.target.closest("[data-drag]");
  if (dragCard && dragged) { event.preventDefault(); dragged = false; }
  const act = event.target.closest("[data-act]");
  if (!act) return;
  const item = findItem(act.dataset.id);
  if (!item || locked(item)) return;
  if (act.dataset.act === "dismiss") item.escalated = false;
  if (act.dataset.act === "drop") { item.status = "Dropped"; item.finished = ""; state.flash = "Dropped. This is not Done."; }
  if (act.dataset.act === "defer") {
    const date = window.prompt("Return on which date? Use YYYY-MM-DD.", "2026-11-09");
    if (!date) return;
    item.parked = item.status;
    item.returns = date;
    item.status = "Deferred";
    state.flash = "";
  }
  render();
});
document.body.addEventListener("change", (event) => {
  if (event.target.dataset.state) setStatus(event.target.dataset.state, event.target.value);
  if (event.target.dataset.category) {
    state.meetings.find((meeting) => meeting.id === event.target.dataset.category).category = event.target.value;
    render();
  }
  if (event.target.dataset.fill) {
    const item = findItem(event.target.dataset.fill);
    const value = event.target.value.trim();
    if (!value) return;
    item.body = item.body.replace(/\[[^\]]+\]/, value);
    state.flash = "";
    render();
  }
});
document.body.addEventListener("dragstart", (event) => {
  const card = event.target.closest("[data-drag]");
  if (!card) return;
  dragged = true;
  event.dataTransfer.setData("text/plain", card.dataset.drag);
});
document.body.addEventListener("dragend", () => { setTimeout(() => { dragged = false; }, 0); });
document.body.addEventListener("dragover", (event) => {
  const slot = event.target.closest("[data-drop]");
  if (!slot) return;
  event.preventDefault();
  slot.classList.add("over");
});
document.body.addEventListener("dragleave", (event) => {
  const slot = event.target.closest("[data-drop]");
  if (slot) slot.classList.remove("over");
});
document.body.addEventListener("drop", (event) => {
  const slot = event.target.closest("[data-drop]");
  const id = event.dataTransfer.getData("text/plain");
  if (!slot || !id) return;
  event.preventDefault();
  setStatus(id, slot.dataset.drop);
});
window.addEventListener("hashchange", () => { state.flash = ""; render(); });
window.addEventListener("popstate", () => { state.flash = ""; render(); });

const initial = location.hash || "#/";
if (!history.state || !history.state.hub) {
  if (initial.startsWith("#/replies/") || initial.startsWith("#/tasks/") || initial.startsWith("#/meetings/")) {
    history.replaceState({ hub: 1 }, "", parentHash(initial));
    history.pushState({ hub: 1 }, "", initial);
  } else history.replaceState({ hub: 1 }, "", initial);
}
render();
</script>
</body>
</html>
